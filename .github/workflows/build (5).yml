name: Build AnimeStream APK

permissions:
  contents: write

#
# Self-extracting build workflow with automatic libmpv setup.
#
# Usage:
#   1. Create a new GitHub repo (private is fine).
#   2. Add this file at .github/workflows/build.yml (paste the contents).
#   3. Upload AnimeStream.zip to the ROOT of the repo via the GitHub web UI.
#   4. Commit. The workflow will:
#        - Extract the project zip
#        - Commit the extracted files back to main [skip ci]
#        - Download the latest mpv-android arm64-v8a release APK
#        - Extract libmpv.so, libplayer.so, and all transitive .so files
#        - Fetch all Anime4K / FSRCNNX / ArtCNN / RAVU / KrigBilateral shaders
#        - Build the APK
#        - Upload the APK as a downloadable artifact
#
# After the first run, the repo has the proper folder structure and you can
# edit files via the web UI — every push triggers a rebuild.
#

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build arm64-v8a APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
          fetch-depth: 0

      - name: Find and extract project ZIP
        id: unzip
        run: |
          set -e
          ZIP_FILE=""
          if ls *.zip >/dev/null 2>&1; then
            ZIP_FILE=$(ls -S *.zip | head -1)
          fi

          if [ -n "$ZIP_FILE" ]; then
            echo "Found ZIP: $ZIP_FILE ($(du -h "$ZIP_FILE" | cut -f1))"
            echo "=== Extracting ==="
            unzip -o "$ZIP_FILE"

            # If the zip extracted into a single top-level folder, lift its contents up
            TOP_DIR=$(find . -maxdepth 1 -type d ! -path '.' ! -path './.git' ! -path './.github' | head -1)
            if [ -n "$TOP_DIR" ] && [ -f "$TOP_DIR/build.gradle.kts" ] && [ ! -f "./build.gradle.kts" ]; then
              echo "Zip nested under $TOP_DIR — lifting contents to repo root"
              cp -r "$TOP_DIR"/* . 2>/dev/null || true
              cp -r "$TOP_DIR"/.github . 2>/dev/null || true
              cp -r "$TOP_DIR"/.gitignore . 2>/dev/null || true
              rm -rf "$TOP_DIR"
            fi

            echo ""
            echo "=== Extracted structure (top 30 entries) ==="
            find . -maxdepth 3 -not -path './.git/*' -type f | head -30

            # Remove the zip so it doesn't pollute the build or get committed back
            rm -f "$ZIP_FILE"
            echo "extracted=true" >> $GITHUB_OUTPUT
          else
            echo "No .zip in repo root — building from checked-out files"
            echo "extracted=false" >> $GITHUB_OUTPUT
          fi

      - name: Commit extracted files back to repo
        if: steps.unzip.outputs.extracted == 'true'
        env:
          REPO_PAT: ${{ secrets.REPO_PAT }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit — files already match zip contents"
          else
            echo "Committing extracted files…"
            git commit -m "Extract project ZIP (auto) [skip ci]"

            # If a REPO_PAT secret is provided, use it to push (useful when branch protection blocks GITHUB_TOKEN)
            if [ -n "${REPO_PAT}" ]; then
              echo "Using REPO_PAT secret to push changes to repository"
              # Ensure branch name is the short name (e.g., 'main')
              BRANCH_NAME=${GITHUB_REF#refs/heads/}
              git remote set-url origin https://x-access-token:${REPO_PAT}@github.com/${{ github.repository }}.git
              git push origin HEAD:${BRANCH_NAME}
            else
              echo "No REPO_PAT secret found — attempting push with GITHUB_TOKEN"
              git push
            fi

            echo "Pushed. Future builds will use these files directly."
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Fix script permissions
        run: |
          find . -name "*.sh" -exec chmod +x {} \;
          chmod +x ./gradlew || true

      - name: Generate gradlew wrapper if missing
        run: |
          if [ ! -f ./gradlew ]; then
            echo "gradlew missing — generating wrapper"
            gradle wrapper --gradle-version 8.9
            chmod +x ./gradlew
          fi

      - name: Show final project structure
        run: |
          echo "=== Files that will be built ==="
          find . -type f -not -path './.git/*' -not -path './.gradle/*' -not -path './gradle/gradle-wrapper.jar' | sort

      # ====================================================================
      # AUTO-DOWNLOAD libmpv + libplayer from mpv-android releases
      # ====================================================================
      - name: Download libmpv native libraries
        id: libmpv
        run: |
          set -e
          echo "=== Checking existing .so files ==="
          if [ -f app/src/main/jniLibs/arm64-v8a/libmpv.so ] && [ -f app/src/main/jniLibs/arm64-v8a/libplayer.so ]; then
            echo "libmpv.so + libplayer.so already present — skipping download"
            echo "skipped=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "skipped=false" >> $GITHUB_OUTPUT

          echo ""
          echo "=== Fetching latest mpv-android release tag ==="
          # Use the GitHub API to find the latest release
          LATEST_TAG=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mpv-android/mpv-android/releases/latest" \
            | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'])")
          echo "Latest release tag: $LATEST_TAG"

          echo ""
          echo "=== Listing release assets ==="
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/mpv-android/mpv-android/releases/latest" \
            | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for a in data.get('assets', []):
              print('  ' + a['name'] + ' (' + str(a['size']//1024//1024) + ' MB)')
              print('    ' + a['browser_download_url'])
          "

          echo ""
          echo "=== Downloading arm64-v8a release APK ==="
          # Try several naming patterns used by mpv-android over the years
          APK_URL=""
          for pattern in "app-default-arm64-v8a-release.apk" "mpv-android-arm64-v8a.apk" "app-arm64-v8a-release.apk" "app-default-arm64-v8a-debug.apk"; do
            URL="https://github.com/mpv-android/mpv-android/releases/download/${LATEST_TAG}/${pattern}"
            if curl -fsSL --head "$URL" >/dev/null 2>&1; then
              APK_URL="$URL"
              echo "Found: $URL"
              break
            fi
          done

          if [ -z "$APK_URL" ]; then
            echo "ERROR: Could not find arm64-v8a APK in release $LATEST_TAG"
            echo "Falling back to universal-debug APK"
            APK_URL="https://github.com/mpv-android/mpv-android/releases/download/${LATEST_TAG}/app-default-universal-debug.apk"
          fi

          mkdir -p /tmp/mpv-apk
          curl -fSL -A "Mozilla/5.0" -o /tmp/mpv-apk/mpv.apk "$APK_URL"
          echo "Downloaded: $(du -h /tmp/mpv-apk/mpv.apk | cut -f1)"

          echo ""
          echo "=== Native libraries in APK ==="
          unzip -l /tmp/mpv-apk/mpv.apk | grep -E 'lib/arm64-v8a/.*\.so$'

          echo ""
          echo "=== Extracting .so files into project ==="
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cd app/src/main/jniLibs/arm64-v8a
          unzip -j -o /tmp/mpv-apk/mpv.apk "lib/arm64-v8a/*.so"
          cd -

          echo ""
          echo "=== Final .so inventory ==="
          ls -la app/src/main/jniLibs/arm64-v8a/

          # Sanity check: libmpv.so and libplayer.so MUST be present
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libmpv.so ]; then
            echo "FATAL: libmpv.so not found after extraction"
            exit 1
          fi
          if [ ! -f app/src/main/jniLibs/arm64-v8a/libplayer.so ]; then
            echo "FATAL: libplayer.so not found after extraction"
            exit 1
          fi
          echo ""
          echo "OK — libmpv.so and libplayer.so present"

      - name: Fetch shaders
        run: |
          if [ -f fetch_shaders.sh ]; then
            bash fetch_shaders.sh
          else
            echo "fetch_shaders.sh not found — shaders will be missing from APK"
          fi

      - name: Build debug APK
        id: build
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-daemon --warning-mode=all 2>&1 | tee build.log
          echo "build_status=success" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: Print first 30 Kotlin compile errors on failure
        if: steps.build.outcome == 'failure'
        run: |
          echo "=========================================="
          echo "=== BUILD FAILED — first 30 error lines ==="
          echo "=========================================="
          grep -iE "(error:|exception|cannot find|unresolved|FAILURE:)" build.log | head -30 || true
          echo ""
          echo "=== Last 200 lines of build log ==="
          tail -200 build.log

      - name: Fail job if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Locate built APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" 2>/dev/null | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "No APK found in expected location"
            find app/build -name "*.apk" 2>/dev/null || true
            exit 1
          fi
          echo "APK: $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp "${{ steps.apk.outputs.apk_path }}" artifacts/animestream-arm64-debug.apk
          ls -la artifacts/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: animestream-arm64-apk
          path: artifacts/animestream-arm64-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7es: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
